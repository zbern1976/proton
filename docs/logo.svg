<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">§PROTON</title>
  <desc id="desc">Formato compacto de comunicação entre modelos, representado por um núcleo e símbolos em órbita.</desc>
  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset=".56" stop-color="#d9f8ff"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#67f4ef"/><stop offset=".48" stop-color="#31a9ff"/><stop offset="1" stop-color="#7659ef"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#31cfff" stop-opacity=".25"/><stop offset="1" stop-color="#31cfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="nucleusGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8ab4d8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="820" height="460" rx="28" fill="#0d1117"/>
  <rect x="1" y="1" width="818" height="458" rx="27" fill="url(#grid)" stroke="#263443" stroke-width="1.5"/>
  <circle cx="570" cy="228" r="206" fill="url(#halo)"/>
  <g fill="#a8c5dc" opacity=".5">
    <circle cx="414" cy="91" r="1.5"/><circle cx="748" cy="126" r="1.2"/>
    <circle cx="743" cy="343" r="1.6"/><circle cx="456" cy="372" r="1"/>
    <circle cx="385" cy="256" r="1.2"/><circle cx="692" cy="68" r="1"/>
  </g>
  <g font-family="system-ui, Arial, sans-serif">
    <text x="58" y="91" fill="url(#titleGradient)" font-size="47" font-weight="750" letter-spacing="-.8">§PROTON</text>
    <path d="M60 111H142" stroke="#45d8f2" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <text x="60" y="151" fill="#d8e2ec" font-size="17" font-weight="500">formato compacto entre modelos</text>
    <text x="60" y="184" fill="#93a4b5" font-size="12.5" letter-spacing=".1">densidade máxima · zero perda de informação</text>
    <g transform="translate(0 0)" fill="none" stroke-linecap="round">
      <ellipse cx="585" cy="230" rx="158" ry="84" transform="rotate(-27 585 230)" stroke="#63d9ef" stroke-opacity=".25" stroke-width="1.3"/>
      <ellipse cx="585" cy="230" rx="204" ry="112" transform="rotate(31 585 230)" stroke="#9db3c7" stroke-opacity=".17" stroke-width="1.15"/>
      <ellipse cx="585" cy="230" rx="158" ry="84" transform="rotate(-27 585 230)" stroke="#72edff" stroke-opacity=".1" stroke-width="5" filter="url(#softGlow)"/>
    </g>
    <g filter="url(#nucleusGlow)">
      <circle cx="585" cy="230" r="43" fill="url(#nucleus)"/>
      <circle cx="585" cy="230" r="43" fill="none" stroke="#b7ffff" stroke-opacity=".72" stroke-width="1.2"/>
    </g>
    <text x="585" y="244" text-anchor="middle" fill="#fff" font-family="system-ui, Arial, sans-serif" font-size="39" font-weight="600">§</text>
    <g font-size="22" font-weight="650" text-anchor="middle" dominant-baseline="central">
      <text x="442" y="204" fill="#55e6a5">✓</text>
      <text x="507" y="150" fill="#ff7185">✗</text>
      <text x="634" y="149" fill="#ffc568">?</text>
      <text x="727" y="220" fill="#c29aff">→</text>
      <text x="663" y="303" fill="#65cfff">⊕</text>
      <text x="507" y="307" fill="#ffad68">⊖</text>
    </g>
    <g fill="#c3d0dc" opacity=".67" font-size="18" font-weight="550" text-anchor="middle" dominant-baseline="central">
      <text x="519" y="75">≈</text><text x="700" y="96">#</text><text x="786" y="229">@</text>
      <text x="671" y="387">!</text><text x="433" y="330">~</text>
    </g>
    <g fill="#72e7f5" opacity=".75"><circle cx="440" cy="204" r="2.5"/><circle cx="727" cy="220" r="2.5"/><circle cx="433" cy="330" r="2"/></g>
    <path d="M60 391H760" stroke="#283544" stroke-width="1"/>
    <text x="60" y="420" fill="#718096" font-size="11.5" letter-spacing=".25">benchmark custo × qualidade · MIT</text>
  </g>
</svg>
